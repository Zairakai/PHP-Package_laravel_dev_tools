# ================================
# PIPELINE TEMPLATE — Package Laravel PHP
# ================================
# Shared pipeline template for Composer/Laravel packages in the Zairakai namespace.
# Self-contained: anchors and jobs are all in this single file.
# YAML anchors do not survive cross-file include: — this is a YAML parser
# limitation, not a GitLab one. Everything is therefore kept here.
#
# All job names are prefixed php: to avoid any collision with JS or custom
# jobs when this template is combined with other templates.
#
# USAGE in a consumer project:
# ─────────────────────────────────────────
#   include:
#     - project: 'zairakai/php-packages/laravel-dev-tools'
#       ref: main
#       file: '.gitlab/ci/pipeline-php-package.yml'
#
#   variables:
#     CACHE_KEY: "my-package"
#     PACKAGIST_PACKAGE: "zairakai/my-package"
#
# FOR laravel-dev-tools ITSELF (self-hosted mode):
# ─────────────────────────────────────────────────────
#   include:
#     - local: '.gitlab/ci/pipeline-php-package.yml'
#
#   variables:
#     CACHE_KEY: "laravel-dev-tool"
#     PACKAGIST_PACKAGE: "zairakai/laravel-dev-tools"
#     DEV_TOOLS_SCRIPTS: "scripts"
#     DEV_TOOLS_GITLAB_SCRIPTS: ".gitlab/scripts"
# ================================

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# ================================
# WORKFLOW
# ================================
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_REF_NAME =~ /^feature\// || $CI_COMMIT_REF_NAME =~ /^fix\// || $CI_COMMIT_REF_NAME =~ /^hotfix\//
    - when: never

# ================================
# STAGES
# ================================
stages:
  - security
  - install
  - validate
  - quality
  - test
  - publish
  - release
  - metrics

# ================================
# DEFAULT VARIABLES
# ================================
variables:
  # ── OVERRIDE PER PROJECT ──────────────────────────────────────────────────
  CACHE_KEY: "zairakai-package"
  PACKAGIST_PACKAGE: "zairakai/package"

  # Paths to dev-tools scripts.
  # Consumer projects do NOT need to override these.
  # laravel-dev-tools itself overrides them in its own .gitlab-ci.yml.
  DEV_TOOLS_SCRIPTS: "vendor/zairakai/laravel-dev-tools/scripts"
  DEV_TOOLS_GITLAB_SCRIPTS: "vendor/zairakai/laravel-dev-tools/.gitlab/scripts"

  # ── DOCKER IMAGES ─────────────────────────────────────────────────────────
  ALPINE_IMAGE: "alpine:3.18"
  DOCKERHUB_IMAGE: "zairakai/php:latest-test"
  # The jobs of the automatic updates sign with gpg: the dev image has it since 2.3.0. An exact version, pulled from Docker Hub.
  PHP_UPDATE_IMAGE: "zairakai/php:2.3.0-dev"
  # The tool is the one of laravel-dev-tools: in vendor/bin for a package that uses it (this project sets its own path).
  UPDATE_DEPENDENCIES_BIN: "vendor/bin/update-dependencies"
  MARKDOWNLINT_IMAGE: "zairakai/node:latest-dev"
  RELEASE_CLI_IMAGE: "registry.gitlab.com/gitlab-org/release-cli:v0.18.0"
  SHELLCHECK_IMAGE: "koalaman/shellcheck-alpine:v0.10.0"

  # ── COMPOSER CACHE ────────────────────────────────────────────────────────
  COMPOSER_CACHE_DIR: ".composer-cache"

  # ── GIT ───────────────────────────────────────────────────────────────────
  GIT_CLEAN_FLAGS: "-ffdx -e vendor/ -e .composer-cache/"
  GIT_DEPTH: 1
  GIT_STRATEGY: fetch

  # ── SECURITY ──────────────────────────────────────────────────────────────
  DS_EXCLUDED_PATHS: "docs/,tests/"
  SAST_EXCLUDED_PATHS: "docs/,tests/"
  SECRET_DETECTION_EXCLUDED_PATHS: "docs/,tests/"

# ================================
# ANCHORS
# ================================
.base_job: &base_job
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.cache_composer: &cache_composer
  cache:
    key:
      files:
        - composer.lock
      prefix: $CACHE_KEY
    paths:
      - vendor/
      - $COMPOSER_CACHE_DIR
    policy: pull

.cache_composer_push: &cache_composer_push
  cache:
    key:
      files:
        - composer.lock
      prefix: $CACHE_KEY
    paths:
      - vendor/
      - $COMPOSER_CACHE_DIR
    policy: pull-push

.job_php: &job_php
  <<: [*base_job, *cache_composer]
  image: ${DOCKERHUB_IMAGE}
  before_script:
    - composer --version

# ================================
# SECURITY
# ================================
secret_detection:
  stage: security
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

# A tag whose format is not the one of VERSION_TAG_REGEX (group variable) fails here,
# and the jobs that publish do not run for it.
php:tag-format:
  <<: *base_job
  stage: security
  image: ${ALPINE_IMAGE}
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG
  script:
    - |
      regex="${VERSION_TAG_REGEX:-}"
      regex="${regex#/}"
      regex="${regex%/}"
      if [ -z "$regex" ]; then
        echo "ERROR: VERSION_TAG_REGEX is not set. It is a variable of the zairakai group."
        exit 1
      fi
      if ! printf '%s\n' "$CI_COMMIT_TAG" | grep -Eq "$regex"; then
        echo "ERROR: the tag \"$CI_COMMIT_TAG\" does not match $VERSION_TAG_REGEX (X.Y.Z or X.Y.Z-prerelease)."
        exit 1
      fi
      echo "Tag $CI_COMMIT_TAG: format OK"

# ================================
# INSTALL
# ================================
php:install:
  <<: [*base_job, *cache_composer_push]
  stage: install
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  image: ${DOCKERHUB_IMAGE}
  script:
    - composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

# ================================
# VALIDATE
# ================================
php:validate:markdownlint:
  <<: [*base_job, *cache_composer]
  stage: validate
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  image: ${MARKDOWNLINT_IMAGE}
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  needs:
    - php:install
  before_script:
    - bash $DEV_TOOLS_SCRIPTS/install-markdownlint.sh
  script:
    - bash $DEV_TOOLS_SCRIPTS/markdownlint.sh

php:validate:shellcheck:
  <<: [*base_job, *cache_composer]
  stage: validate
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  image: ${SHELLCHECK_IMAGE}
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  needs:
    - php:install
  before_script:
    - apk add --no-cache bash
  script:
    - bash $DEV_TOOLS_SCRIPTS/validate-shellcheck.sh

# ================================
# QUALITY
# ================================
php:quality:code-style:
  <<: *job_php
  stage: quality
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  needs:
    - php:validate:shellcheck
    - php:validate:markdownlint
  script:
    - bash "$DEV_TOOLS_SCRIPTS/cs-check.sh"

php:quality:static-analysis:
  <<: *job_php
  stage: quality
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  needs:
    - php:validate:shellcheck
    - php:validate:markdownlint
  script:
    - bash "$DEV_TOOLS_SCRIPTS/phpstan.sh"
  artifacts:
    paths:
      - build/phpstan/
    expire_in: 1 week
    when: on_failure

php:quality:rector:
  <<: *job_php
  stage: quality
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  needs:
    - php:validate:shellcheck
    - php:validate:markdownlint
  script:
    - bash "$DEV_TOOLS_SCRIPTS/rector-check.sh"

php:quality:insights:
  <<: *job_php
  stage: quality
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  needs:
    - php:validate:shellcheck
    - php:validate:markdownlint
  script:
    - bash "$DEV_TOOLS_SCRIPTS/insights.sh"

php:quality:outdated:
  <<: *job_php
  stage: quality
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs:
    - php:validate:shellcheck
    - php:validate:markdownlint
  script:
    - bash "$DEV_TOOLS_SCRIPTS/outdated.sh"
  artifacts:
    paths:
      - build/reports/outdated.json
    expire_in: 1 week

php:quality:security:
  <<: *job_php
  stage: quality
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  needs:
    - php:validate:shellcheck
    - php:validate:markdownlint
  script:
    - bash "$DEV_TOOLS_SCRIPTS/security-audit.sh"
  artifacts:
    paths:
      - build/logs/audit-report.json
    expire_in: 1 month
    when: always

# ================================
# TEST
# ================================
php:test:
  <<: *job_php
  stage: test
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - when: on_success
  before_script:
    - mkdir -p build/logs build/coverage
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git config --global init.defaultBranch main
    - git config --global --add safe.directory '*'
  script:
    - CI=true bash "$DEV_TOOLS_SCRIPTS/test.sh"
  coverage: '/Lines:\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      junit: build/logs/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: build/logs/cobertura.xml
    paths:
      - build/logs/
      - build/coverage/
    expire_in: 1 week
    when: always

# ================================
# PUBLISH
# ================================
php:publish:
  <<: [*base_job, *cache_composer]
  stage: publish
  image: ${ALPINE_IMAGE}
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
  needs:
    - php:test
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash "$DEV_TOOLS_GITLAB_SCRIPTS/packagist-release.sh"

# ================================
# RELEASE
# ================================
php:release:
  <<: [*base_job, *cache_composer]
  stage: release
  image: ${RELEASE_CLI_IMAGE}
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
  needs:
    - php:publish
  before_script:
    - apk add --no-cache bash git jq
    - git config --global --add safe.directory '*'
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@gitlab.com"
  script:
    - |
      bash "$DEV_TOOLS_GITLAB_SCRIPTS/generate-release-notes.sh"
      if [ ! -f release_notes.md ]; then
        echo "❌ ERROR: release_notes.md not created"
        exit 1
      fi
      release-cli create \
        --tag-name "${CI_COMMIT_TAG}" \
        --name "Release ${CI_COMMIT_TAG}" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"Packagist\",\"url\":\"https://packagist.org/packages/${PACKAGIST_PACKAGE}#${CI_COMMIT_TAG}\"}"
  artifacts:
    paths:
      - release_notes.md
    expire_in: 1 year

# ================================
# METRICS
# ================================
php:metrics:
  <<: *job_php
  stage: metrics
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
  needs:
    - php:release
  script:
    - bash "$DEV_TOOLS_SCRIPTS/phpmetrics.sh"
  artifacts:
    paths:
      - build/phpmetrics/
    expire_in: 1 month

# ================================
# DOCUMENTATION
# ================================
# The documentation site (GitLab Pages): every released version, each built from its own tag, and next, with a version
# selector. See docs/scripts/publish.sh in the project. It comes with the release: a tag is always a release of main, and
# nothing is published if the publication failed. A project without docs/scripts/publish.sh has no site.
pages:
  <<: *base_job
  stage: release
  image: zairakai/node:latest-dev
  needs:
    - job: php:publish
  variables:
    GIT_DEPTH: 0
  before_script:
    - node --version
  script:
    - bash docs/scripts/publish.sh
  # The next jobs of the runner must not find (and lint) the docs dependencies or what they generate.
  after_script:
    - rm -rf docs/node_modules docs/.vitepress/dist docs/.vitepress/cache
    - git clean -fdXq docs || true
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $UPDATE_DEPENDENCIES == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
      exists:
        - docs/scripts/publish.sh

# ================================
# AUTOMATIC UPDATES
# ================================
# The group variable GITLAB_TOKEN (protected, so these jobs run on main, develop and the tags) opens the merge requests,
# merges them and creates the tags. The pipeline of each merge request is the gate: nothing is tested by these jobs.
# A weekly schedule (or a pipeline started by the cascade) with UPDATE_DEPENDENCIES=true prepares the update.
deps:update:
  <<: *base_job
  stage: install
  image: ${PHP_UPDATE_IMAGE}
  needs: []
  script:
    - composer install --prefer-dist --no-interaction --no-progress
    # The tool of the lock file may be old: take the newest one first (this project runs its own copy).
    - '[ "${UPDATE_DEPENDENCIES_BIN}" = "bin/update-dependencies" ] || composer update zairakai/laravel-dev-tools --no-interaction --no-progress'
    - php "${UPDATE_DEPENDENCIES_BIN}" update
  rules:
    - if: $UPDATE_DEPENDENCIES == "true" && $AUDIT_DEPENDENCIES != "true" && $CI_COMMIT_BRANCH == "develop"

# A daily schedule with UPDATE_DEPENDENCIES=true and AUDIT_DEPENDENCIES=true looks for security advisories: one issue per
# advisory (ntfy alert, closed when it is gone) and, with the group variable AUTO_FIX=true, an update started to fix it.
# The token FRESHNESS_TOKEN of the group (else GITLAB_TOKEN) opens the issues and starts the update; NTFY_URL is the alert.
deps:audit:
  <<: *base_job
  stage: install
  image: ${PHP_UPDATE_IMAGE}
  needs: []
  script:
    - composer install --prefer-dist --no-interaction --no-progress
    # The tool of the lock file may be old: take the newest one first (this project runs its own copy).
    - '[ "${UPDATE_DEPENDENCIES_BIN}" = "bin/update-dependencies" ] || composer update zairakai/laravel-dev-tools --no-interaction --no-progress'
    - php "${UPDATE_DEPENDENCIES_BIN}" audit
  rules:
    - if: $UPDATE_DEPENDENCIES == "true" && $AUDIT_DEPENDENCIES == "true" && $CI_COMMIT_BRANCH == "develop"

# After the merge of an update into develop, bring develop into main.
deps:release:
  <<: *base_job
  stage: release
  image: ${DOCKERHUB_IMAGE}
  script:
    - composer install --prefer-dist --no-interaction --no-progress
    # The tool of the lock file may be old: take the newest one first (this project runs its own copy).
    - '[ "${UPDATE_DEPENDENCIES_BIN}" = "bin/update-dependencies" ] || composer update zairakai/laravel-dev-tools --no-interaction --no-progress'
    - php "${UPDATE_DEPENDENCIES_BIN}" release
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /chore\/update-dependencies/

# After the merge of an update into main, tag it when a published range changed. The tag starts the publication.
deps:tag:
  <<: *base_job
  stage: release
  image: ${PHP_UPDATE_IMAGE}
  variables:
    GIT_DEPTH: 0
  script:
    - composer install --prefer-dist --no-interaction --no-progress
    # The tool of the lock file may be old: take the newest one first (this project runs its own copy).
    - '[ "${UPDATE_DEPENDENCIES_BIN}" = "bin/update-dependencies" ] || composer update zairakai/laravel-dev-tools --no-interaction --no-progress'
    - php "${UPDATE_DEPENDENCIES_BIN}" tag
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"

# After the publication, start the update of the projects that use this package (only if the project has a cascade).
deps:cascade:
  <<: *base_job
  stage: release
  image: ${DOCKERHUB_IMAGE}
  needs:
    - job: php:publish
  script:
    - composer install --prefer-dist --no-interaction --no-progress
    # The tool of the lock file may be old: take the newest one first (this project runs its own copy).
    - '[ "${UPDATE_DEPENDENCIES_BIN}" = "bin/update-dependencies" ] || composer update zairakai/laravel-dev-tools --no-interaction --no-progress'
    - php "${UPDATE_DEPENDENCIES_BIN}" cascade
  rules:
    - if: $CI_COMMIT_TAG =~ $VERSION_TAG_REGEX
